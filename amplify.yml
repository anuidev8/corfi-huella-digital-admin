version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm ci
        - env | grep -E '^(NEXT_PUBLIC_|SUPABASE_|OPENAI_|AZURE_|PORTRAIT_|LIVEKIT_|MODERATOR_|ATTENDEES_|CORFILINK_|GEMINI_|AWS_|OPENROUTER_|PHOTO_ART_)' > .env.production || true
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
